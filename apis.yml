aid: lucky-cart
name: Lucky Cart
description: 'Lucky Cart is a French MarTech company specializing in retail media and smart commerce
  for grocery and consumer-goods retailers. It combines first-party transactional data with e-retail
  media, machine learning, and AI to power personalized shopper engagement, gamified promotions, and
  the monetization of retailer audiences at scale. Lucky Cart works with major French grocery retailers
  and CPG brands to activate transactional data into targeted advertising, loyalty, and measurable
  campaigns. Its integration surface is a set of HTTP APIs consumed through three first-party SDKs
  published on GitHub — a shopper-event ingest, a promotional banner displayer, a cart-to-ticket
  endpoint that mints the post-purchase game, and a hosted game experience. Lucky Cart publishes no
  OpenAPI, no developer portal and no self-service signup: API keys are issued manually by its
  integration team to contracted retailers, and its Help Centre is access-restricted.'
