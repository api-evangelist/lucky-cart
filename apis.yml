apis:
- aid: lucky-cart:core-api
  name: Lucky Cart Core API
  description: 'The core Lucky Cart API. POST /cart/ticket submits a validated shopping cart —
    cart identifier, shopper identifier, gross and net amounts, and product lines — and Lucky Cart
    determines whether a game can be generated, returning a ticket plus the device-specific intro
    image and game URL. This is the only signed endpoint: the request body carries auth_ts, auth_key,
    auth_v "2.0" and auth_sign, an HMAC-SHA256 digest of the timestamp keyed by the site secret. Game
    data is read back at /{siteKey}/game/{cartId} or /{siteKey}/game/cust/{shopperId}, optionally
    suffixed with the device. Cart ingestion is asynchronous, so the read returns the literal error
    "Cart not found" until it completes and clients poll on a bounded attempt budget.'
  humanURL: https://github.com/lucky-cart/luckycart-js-sdk#send-the-current-transaction
  baseURL: https://api.luckycart.com
  tags:
  - Transaction
  - Promotions
  - Gamification
  tags_raw:
  - Transactions
  - Promotions
  - Gamification
  properties:
  - type: Authentication
    url: authentication/lucky-cart-authentication.yml
  - type: Conventions
