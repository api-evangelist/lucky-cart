  - type: SourceCode
    url: https://github.com/lucky-cart/luckycart-js-sdk
- aid: lucky-cart:shopper-events-api
  name: Lucky Cart Shopper Events API
  description: 'Event ingest for shopper behaviour on a retailer storefront. A single POST /event
    endpoint accepts {shopperId, siteKey, eventName, payload}, where eventName is a Lucky Cart event
    such as pageViewed or cartValidated and the payload carries the page context — pageType, pageId,
    storeType and storeId. Events are what make a shopper eligible for banner selection and for a
    game experience, so the event call precedes every banner or experience read in the documented
    integration workflow. The service is versioned in the URI path at /v1 and accepts an empty
    response body on success.'
  humanURL: https://github.com/lucky-cart/lucky-cart-ios#pageviewed-event
  baseURL: https://shopper-events.luckycart.com/v1
  tags:
  - Event
  - Analytics
  - Shopper Marketing
  tags_raw:
  - Events
  - Analytics
  - Shopper Marketing
  properties:
  - type: Authentication
    url: authentication/lucky-cart-authentication.yml
  - type: SourceCode
    url: https://github.com/lucky-cart/lucky-cart-ios
- aid: lucky-cart:shopper-experience-api
  name: Lucky Cart Shopper Experience API
  description: 'Returns the set of Lucky Cart experiences currently available to a given shopper.
    GET /experiences takes shopperId, siteKey and an experienceType filter as query parameters and
    answers with the experiences that shopper is eligible for. Used by the web SDK to decide what to
    surface to a returning shopper independently of a specific cart. Versioned in the URI path at
    /v1. No pagination is offered on the collection.'
  humanURL: https://github.com/lucky-cart/luckycart-js-sdk
  baseURL: https://shopper-experience.luckycart.com/v1
  tags:
  - Experience
  - Personalization
  tags_raw:
  - Experiences
  - Personalization
  properties:
  - type: Authentication
    url: authentication/lucky-cart-authentication.yml
  - type: SourceCode
    url: https://github.com/lucky-cart/luckycart-js-sdk
- aid: lucky-cart:game-experience-api
  name: Lucky Cart Game Experience API
  description: 'Grants access to the gamified post-purchase experiences a shopper has earned. GET
    /game-experiences-access takes shopperId, siteKey and a count parameter capping how many
    experiences to return, and answers with the game experiences and the template each should be
    rendered with. The mobile SDKs call this after a cartValidated event to decide which game to
    present. Versioned in the URI path at /v1. The count parameter is the only collection-bounding
    mechanism — there is no cursor or offset.'
  humanURL: https://github.com/lucky-cart/lucky-cart-ios#configuration
  baseURL: https://game-experience-api.luckycart.com/v1
  tags:
  - Gamification
  - Loyalty
  - Experience
  tags_raw:
  - Gamification
  - Loyalty
  - Experiences
  properties:
  - type: Authentication
    url: authentication/lucky-cart-authentication.yml
  - type: SourceCode
    url: https://github.com/lucky-cart/lucky-cart-ios
- aid: lucky-cart:displayer-api
  name: Lucky Cart Displayer API
  description: 'Selects and returns the promotional banner to render for a given page context. The
    route encodes the whole selection key in the path — /{siteKey}/{shopper}/banner/{platform}/
    {pageType}/{format} for a single promotion, or /banners/ for every matching promotion — with
    pageId, store and store_type as optional query parameters for finer targeting such as
    store-local promotions. Platform distinguishes desktop, mobile and webmobile inventory. The
    response carries the image URL, the click-through URL, the campaign identifier and the campaign
    name. This host is unversioned.'
  humanURL: https://github.com/lucky-cart/lucky-cart-ios#request-the-banner-data
  baseURL: https://displayer.luckycart.com
  tags:
  - Retail Media
  - Advertising
  - Banners
  properties:
  - type: Authentication
    url: authentication/lucky-cart-authentication.yml
  - type: Components
    url: components/lucky-cart-components.yml
  - type: SourceCode
    url: https://github.com/lucky-cart/lucky-cart-ios
- aid: lucky-cart:promo-matching-api
  name: Lucky Cart Promo Matching API
  description: 'The promo-matching and creative-delivery host used by the JavaScript SDK. It serves
    the same banner selection routes as the displayer — /{siteKey}/{shopper}/banner|banners/{subset}/
    {pageType}/{format} where subset is desktop, mobile or webmobile — and additionally serves the
    creative itself and the click-through redirect at /{campaignId}/{customer}/image and
    /{campaignId}/{customer}/jump. Those two per-campaign, per-customer URLs are how impression and
    click attribution are bound to an individual shopper. Unversioned; answers 204 at its root.'
  humanURL: https://github.com/lucky-cart/luckycart-js-sdk#display-banners
  baseURL: https://promomatching.luckycart.com
  tags:
  - Retail Media
  - Advertising
  - Attribution
  properties:
  - type: Components
    url: components/lucky-cart-components.yml
  - type: SourceCode
    url: https://github.com/lucky-cart/luckycart-js-sdk
