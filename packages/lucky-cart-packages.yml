note: >-
  Lucky Cart publishes three first-party client SDKs from its own GitHub organization
  (github.com/lucky-cart). None of the three are distributed through npm, PyPI, Maven
  Central, NuGet, RubyGems, Packagist or crates.io — a search of the npm registry for
  "luckycart" and "lucky-cart" returned no Lucky Cart package. Distribution is: a CDN
  script tag (JavaScript), Swift Package Manager pointed straight at the GitHub repo
  (iOS), and JitPack building from the GitHub tag (Android). Every one of the three
  SDKs last shipped in 2022-2023; see the currency block below.
