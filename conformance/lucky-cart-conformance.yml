note: >-
  Two separate things are recorded here. First, a real published compliance claim: Lucky
  Cart states on its own certifications page that it is ISO 9001 certified, audited by
  certifying professionals on a three-year renewal cycle. That is a quality-management
  certification, not an information-security one — no SOC 2, ISO 27001, PCI DSS, HIPAA
  or FedRAMP claim appears anywhere on luckycart.com. Second, the cross-cutting API
  standards below, each judged against Lucky Cart's own SDK source because no OpenAPI is
  published. Every "conforms: false" here is a measured absence, not an assumption.
certifications:
- id: iso-9001
  name: ISO 9001
  domain: quality management system
  claimed: true
  scope: Lucky Cart's Quality Management System
  renewal_cycle: three years
  auditor: named only as "certifying professionals"; certifying body not published
  certificate_published: false
  evidence: https://www.luckycart.com/en/certifications
