maturity:
  api_surface: live
  client_surface: unmaintained
  assessment: >-
    A live platform with a lapsed public client surface. All six API hosts resolve to the
    same origin (130.211.45.3) and answer, so the services are running. But no client
    library has shipped since 2023-01-09, the JavaScript SDK's own documented CDN loader
    URL now returns 404, and the Help Centre that carries the integration articles is
    access-restricted. An integrator arriving today from the public surface cannot
    complete the documented installation step for the web SDK.
