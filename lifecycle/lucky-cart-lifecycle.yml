note: >-
  Lucky Cart publishes no API versioning policy, no deprecation policy, no SLA and no
  status page. The only lifecycle signal it emits publicly is SDK release tags on its own
  GitHub organization, and those stopped in early 2023. This file records that state
  honestly; no StatusPage and no Deprecation pointer is emitted in apis.yml, because
  neither exists.
versioning:
  scheme: uri-path, inconsistently applied
  current: v1 on three of six services; the other three are unversioned
  policy_url: null
  policy_published: false
  detail: >-
    shopper-events, shopper-experience and game-experience-api each pin /v1 into their
    base URL. api.luckycart.com, displayer.luckycart.com and promomatching.luckycart.com
    carry no version segment. No policy explains the split, and no v2 of anything is
    referenced. See conventions/lucky-cart-conventions.yml.
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  evidence: >-
    No Sunset or Deprecation header is set or read anywhere in the three first-party
    SDKs, and no deprecation, migration or end-of-life page exists on luckycart.com or in
    the GitHub organization. There is no announced path off any endpoint.
sla:
  url: null
  published: false
  uptime_target: null
  evidence: >-
    No SLA, uptime commitment or support-response commitment is published on the public
    site. Commercial terms sit behind a sales conversation — see
    plans/lucky-cart-plans-pricing.yml.
status_page:
  url: null
  published: false
